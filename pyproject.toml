# Packaging: lets anyone run  pip install git+https://github.com/AccidentalSpaceMan/crypto-inventory-scanner
# and then use the  cryptoinv  command.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-inventory-scanner"
dynamic = ["version"]   # read from cryptoinv/__init__.py, so it's defined in one place
description = "Inventory the cryptography in a codebase, grade it BROKEN / LEGACY / CURRENT, flag what quantum computers will break, and write a CycloneDX CBOM or SARIF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AccidentalSpaceMan" }]
requires-python = ">=3.10"
dependencies = []       # scanning code needs nothing beyond Python
keywords = ["cryptography", "cbom", "cyclonedx", "sarif", "post-quantum", "security", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
keys = ["cryptography>=44"]   # pip install "crypto-inventory-scanner[keys]" to read certificate and key files

[project.scripts]
cryptoinv = "cryptoinv.cli:main"

[project.urls]
Homepage = "https://github.com/AccidentalSpaceMan/crypto-inventory-scanner"
Issues = "https://github.com/AccidentalSpaceMan/crypto-inventory-scanner/issues"

[tool.setuptools]
packages = ["cryptoinv"]

[tool.setuptools.package-data]
cryptoinv = ["rules.json"]

[tool.setuptools.dynamic]
version = { attr = "cryptoinv.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests deliberately create old DSA / DH keys to check they're flagged.
filterwarnings = ["ignore::cryptography.utils.CryptographyDeprecationWarning"]
