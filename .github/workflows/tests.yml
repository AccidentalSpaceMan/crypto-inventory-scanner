# GitHub Actions: run the test suite automatically.
# GitHub reads every .yml file in .github/workflows/ and runs it on its own servers.

name: Tests

# When to run: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, so don't give it write access.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # A "matrix" runs the same job several times with different settings,
    # so we know the scanner works on several Python versions and on Windows.
    strategy:
      fail-fast: false # keep running the other combinations if one fails
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      # Smoke test: the scanner runs end to end on its own code and writes both output formats.
      # (The few lines that name key types only to recognise them carry "cryptoinv: ignore".)
      - name: Scan this project's own code
        run: python -m cryptoinv scan cryptoinv --no-color --fail-on legacy --cbom self.cbom.json --sarif self.sarif

  # Install the project as a package, the way a user would, and run the cryptoinv command from
  # outside the repository so it can't accidentally use the source files.
  package:
    name: Install as a package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the package (not editable)
        run: python -m pip install ".[keys]"

      - name: Run the installed command
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          cryptoinv --version
          cryptoinv scan "$GITHUB_WORKSPACE/cryptoinv" --no-color --fail-on legacy
          if cryptoinv scan "$GITHUB_WORKSPACE/tests/samples" --no-color --fail-on broken > /dev/null; then
            echo "Expected --fail-on broken to exit 1 on the deliberately weak samples"
            exit 1
          fi
          echo "The installed package works"
